name: CI

on:
  push:
    branches: [main, backend/server]
  pull_request:
    branches: [main, backend/server]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  FRONTEND_DIR: mediqweb/mediqweb-fe
  SERVER_DIR: server

jobs:
  lint:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci
      - name: Run prettier lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

  typecheck:
    name: Typecheck (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci
      - name: Run typecheck
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci
      - name: Run frontend tests
        working-directory: ${{ env.FRONTEND_DIR }}
        # vitest cannot run this project's Jasmine specs: angular.json has no
        # `test` architect target, no vitest config exists, and no browser is
        # installed for headless `ng test`. Fall back to the tsc type check
        # (the project's existing `npm test` equivalent) on app source.
        run: npm test
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      - name: Run server tests
        working-directory: ${{ env.SERVER_DIR }}
        run: ./gradlew test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci
      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build server
        working-directory: ${{ env.SERVER_DIR }}
        run: ./gradlew build
