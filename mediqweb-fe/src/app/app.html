<!--
  Temporary design-system preview. Replaced by the auth/staff layouts once
  Step 3 begins. Consumes only tokens from `styles/_variables.scss`.
-->
<main class="preview">
  <header class="preview__header">
    <p class="preview__brand">MediQ</p>
    <h1>Design system</h1>
    <p class="preview__lead">Foundation tokens for MediQ staff interfaces.</p>
  </header>

  <section class="preview__section">
    <h2>Colour</h2>
    <div class="swatches">
      @for (token of swatches; track token) {
        <div class="swatch">
          <span class="swatch__chip" [style.background]="'var(' + token + ')'"></span>
          <code>{{ token }}</code>
        </div>
      }
    </div>
  </section>

  <section class="preview__section">
    <h2>Typography</h2>
    <p class="type-sample type-sample--page">Page title 24/28/700</p>
    <p class="type-sample type-sample--section">Section title 16/20/600</p>
    <p class="type-sample">Body text 14/20/400</p>
    <p class="type-sample type-sample--small">Secondary text 12/16/400</p>
  </section>

  <section class="preview__section">
    <h2>Controls</h2>
    <div class="controls">
      <button class="button button--primary" type="button">Log in</button>
      <button class="button" type="button">Cancel</button>
      <input class="control" type="text" placeholder="Username" aria-label="Username" />
      <span class="badge badge--success">Confirmed</span>
      <span class="badge badge--warning">Pending</span>
    </div>
  </section>

  <router-outlet />
</main>
