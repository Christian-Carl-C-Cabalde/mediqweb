<ui-card padding="none" class="stat">
  <div class="stat__top">
    <p class="stat__label">{{ label() }}</p>
    <span class="stat__icon" aria-hidden="true">
      <ng-content select="[statIcon]" />
    </span>
  </div>

  <p class="stat__value">{{ value() }}</p>

  @if (trend() || hint()) {
    <p class="stat__meta">
      @if (trend(); as t) {
        <span
          class="stat__trend"
          [class.stat__trend--up]="t === 'up'"
          [class.stat__trend--down]="t === 'down'"
          [class.stat__trend--accent]="highlightTrend()"
        >
          <span aria-hidden="true">{{ trendGlyph() }}</span>
          <span class="visually-hidden">{{ trendText() }}</span>
          {{ trendLabel() }}
        </span>
      }
      @if (hint()) {
        <span class="stat__hint">{{ hint() }}</span>
      }
    </p>
  }
</ui-card>
