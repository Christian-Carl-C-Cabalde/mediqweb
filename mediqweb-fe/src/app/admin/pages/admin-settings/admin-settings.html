<form [formGroup]="form" (ngSubmit)="save()">
  <div class="sections">
    <ui-card heading="Clinic details" [headingLevel]="3">
      <p class="section-hint">Shown on appointment confirmations and patient messages.</p>

      <ui-form-field
        label="Clinic name"
        controlId="clinic-name"
        [required]="true"
        [error]="errorFor('clinicName')"
      >
        <input id="clinic-name" type="text" formControlName="clinicName" autocomplete="off" />
      </ui-form-field>

      <ui-form-field
        label="Address"
        controlId="clinic-address"
        [required]="true"
        [error]="errorFor('address')"
      >
        <input id="clinic-address" type="text" formControlName="address" autocomplete="off" />
      </ui-form-field>

      <div class="pair">
        <ui-form-field
          label="Contact email"
          controlId="clinic-email"
          [required]="true"
          [error]="errorFor('contactEmail')"
        >
          <input id="clinic-email" type="email" formControlName="contactEmail" autocomplete="off" />
        </ui-form-field>

        <ui-form-field
          label="Contact number"
          controlId="clinic-phone"
          [required]="true"
          [error]="errorFor('contactNumber')"
        >
          <input id="clinic-phone" type="tel" formControlName="contactNumber" autocomplete="off" />
        </ui-form-field>
      </div>
    </ui-card>

    <ui-card heading="Appointments" [headingLevel]="3">
      <p class="section-hint">
        Defaults a Secretary sees when booking. Individual bookings can differ.
      </p>

      <ui-form-field label="Default slot length" controlId="setting-slot">
        <ui-dropdown
          id="setting-slot"
          [items]="slotLengths"
          [selected]="selectedOf('slotLength')"
          (selectionChange)="pick('slotLength', $event)"
        />
      </ui-form-field>

      <ui-form-field label="How far ahead patients may book" controlId="setting-window">
        <ui-dropdown
          id="setting-window"
          [items]="bookingWindows"
          [selected]="selectedOf('bookingWindow')"
          (selectionChange)="pick('bookingWindow', $event)"
        />
      </ui-form-field>

      <ui-form-field label="Reminder lead time" controlId="setting-reminder">
        <ui-dropdown
          id="setting-reminder"
          [items]="reminderLeadTimes"
          [selected]="selectedOf('reminderLeadTime')"
          (selectionChange)="pick('reminderLeadTime', $event)"
        />
      </ui-form-field>
    </ui-card>

    <ui-card heading="Security and records" [headingLevel]="3">
      <p class="section-hint">Applies to every staff member. Both need a server to enforce them.</p>

      <ui-form-field label="Sign out idle staff after" controlId="setting-timeout">
        <ui-dropdown
          id="setting-timeout"
          [items]="sessionTimeouts"
          [selected]="selectedOf('sessionTimeout')"
          (selectionChange)="pick('sessionTimeout', $event)"
        />
      </ui-form-field>

      <ui-form-field
        label="Keep audit logs for"
        controlId="setting-retention"
        hint="How long account and record changes stay searchable."
      >
        <ui-dropdown
          id="setting-retention"
          [items]="retentionPeriods"
          [selected]="selectedOf('retentionPeriod')"
          (selectionChange)="pick('retentionPeriod', $event)"
        />
      </ui-form-field>
    </ui-card>
  </div>

  @if (notice(); as message) {
    <p class="row-notice" role="status">
      {{ message }}
      <ui-button variant="ghost" size="sm" (click)="notice.set(null)">Dismiss</ui-button>
    </p>
  }

  <div class="actions">
    <ui-button type="submit" variant="primary">Save changes</ui-button>
  </div>
</form>
