version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediq"]
      interval: 10s
      timeout: 5s
      retries: 5

  ktor-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8099:8099"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/mediq
      - DB_USER=mediq
      - DB_PASSWORD=mediq_dev_password
      - DB_DRIVER=org.postgresql.Driver
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=http://localhost:4200,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-fe:
    build:
      context: ./mediqweb/mediqweb-fe
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - ktor-server
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8099}

volumes:
  postgres_data: